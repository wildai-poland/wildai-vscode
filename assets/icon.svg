<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="112" fill="#0c0d10"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)"/>

  <!-- WildAI Bot Head: Minimalist, clean, slightly tilted cute & futuristic orb -->
  <g transform="translate(256, 256)">
    <!-- Base White Bot Orb -->
    <circle cx="0" cy="0" r="140" fill="#ffffff"/>

    <!-- Eyes cut-out (WildAI curious tilted capsule eyes) -->
    <!-- Left eye -->
    <rect x="-4" y="-48" width="24" height="46" rx="12" fill="#0c0d10" transform="rotate(28 -4 -48)"/>
    <!-- Right eye -->
    <rect x="42" y="-22" width="22" height="42" rx="11" fill="#0c0d10" transform="rotate(32 42 -22)"/>
  </g>
</svg>
